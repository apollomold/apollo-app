<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APOLLO+</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ec4899">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APOLLO+">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,"Noto Sans KR",sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#6b7280;text-align:center;padding:20px}
  #bell{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:10;background:#ec4899;color:#fff;border:0;border-radius:99px;padding:11px 20px;font-size:14px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
  #tk{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}
  #tk div{background:#fff;border-radius:14px;padding:16px;width:min(420px,100%)}
  #tk textarea{width:100%;height:110px;font-size:11px;box-sizing:border-box}
  #tk button{margin-top:8px;padding:9px 14px;border:0;border-radius:8px;background:#ec4899;color:#fff;font-weight:700;margin-right:6px}
</style>
</head>
<body>
<div id="msg">APOLLO+ 불러오는 중…</div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbxiXPoC7DfW6S-C54yeHuJS-6HUKOa6Vk0UHZc-YskSjvShdPv43ksYpuJByy4BfmK1GQ/exec" allow="clipboard-write; camera; microphone"></iframe>
<button id="bell" type="button">🔔 알림 켜기</button>
<div id="tk"><div><b>알림 준비 완료</b><p style="font-size:13px;color:#374151;margin:6px 0">아래 글자는 이 폰의 알림 주소(토큰)입니다. 시험 발송 때 사용합니다.</p><textarea id="tkv" readonly></textarea><br><button type="button" id="tkc">복사</button><button type="button" id="tkx" style="background:#9ca3af">닫기</button></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var frame=$('app'), bell=$('bell'), TOKEN='', REG=null;
  frame.addEventListener('load',function(){ var m=$('msg'); if(m) m.remove(); sendToApp(); });

  var supported=('serviceWorker' in navigator)&&('Notification' in window)&&('PushManager' in window);
  var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);

  function sendToApp(){ if(TOKEN&&frame.contentWindow) frame.contentWindow.postMessage({type:'apFcm',token:TOKEN,platform:isIOS?'ios':'android'},'*'); }
  window.addEventListener('message',function(e){ if(e.data&&e.data.type==='apFcmAsk') sendToApp(); });

  function getToken(){
    if(!firebase.apps.length) firebase.initializeApp(self.APOLLO_FB);
    var messaging=firebase.messaging();
    messaging.onMessage(function(p){ var d=p.data||{}, n=p.notification||{}; if(REG) REG.showNotification(d.title||n.title||'APOLLO+',{body:d.body||n.body||'',icon:'icons/icon-192.png',data:{url:d.url||'./'}}); });
    return messaging.getToken({vapidKey:self.APOLLO_VAPID,serviceWorkerRegistration:REG}).then(function(t){ TOKEN=t||''; try{localStorage.setItem('apFcm',TOKEN)}catch(e){} sendToApp(); return TOKEN; });
  }

  if(supported){
    navigator.serviceWorker.register('sw.js').then(function(r){ return navigator.serviceWorker.ready; }).then(function(r){
      REG=r;
      if(Notification.permission==='granted'){ getToken().catch(function(){}); }
      else if(Notification.permission==='default'){ bell.style.display='block'; }
    }).catch(function(){});
  } else if(isIOS&&!standalone){
    bell.textContent='🔔 알림: 홈 화면에 추가한 앱에서 켤 수 있어요'; bell.style.display='block'; bell.onclick=function(){ alert('사파리 공유 버튼 → 홈 화면에 추가 후, 홈 화면 아이콘으로 열어 주세요.'); };
  }

  bell.addEventListener('click',function(){
    if(!supported||!REG) return;
    Notification.requestPermission().then(function(p){
      if(p!=='granted'){ alert('알림이 허용되지 않았습니다. 폰 설정에서 APOLLO+ 알림을 허용해 주세요.'); return; }
      bell.style.display='none';
      return getToken().then(function(t){ $('tkv').value=t; $('tk').style.display='flex'; });
    }).catch(function(e){ alert('알림 설정 오류: '+(e&&e.message?e.message:e)); });
  });
  $('tkc').onclick=function(){ var t=$('tkv'); t.select(); try{ navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); } this.textContent='복사됨'; };
  $('tkx').onclick=function(){ $('tk').style.display='none'; };
})();
</script>
</body>
</html>
