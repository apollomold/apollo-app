<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APOLLO+</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ec4899">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APOLLO+">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#fff}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:14px sans-serif;color:#6b7280;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="msg">APOLLO+ 불러오는 중…</div>
<!-- ★ 아래 주소를 Apps Script 웹앱 배포 주소(…/exec)로 바꿔 주세요 -->
<iframe id="app" src="https://script.google.com/macros/s/AKfycbxiXPoC7DfW6S-C54yeHuJS-6HUKOa6Vk0UHZc-YskSjvShdPv43ksYpuJByy4BfmK1GQ/exec" allow="clipboard-write; camera; microphone"></iframe>
<script>
  document.getElementById('app').addEventListener('load', function(){ var m=document.getElementById('msg'); if(m) m.remove(); });
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
